- name: Postgresql Setup
  hosts: all
  become: yes
  tasks:
    - name: Install Postgresql 16 repo
      ansible.builtin.dnf:
        name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
        state: installed
        disable_gpg_check: yes

    - name: Disable PostgreSQL default module
      ansible.builtin.shell: dnf -qy module disable postgresql

    - name: Install Postgreseql 16
      ansible.builtin.dnf:
        name:
          - "postgresql16-server"
          -  "postgresql16"
        state: present

    - name: Initialize Database
      ansible.builtin.shell: /usr/pgsql-16/bin/postgresql-16-setup initdb
      ignore_errors: yes


    - name: Replace  listen_addresses
      ansible.builtin.replace:
        path: /var/lib/pgsql/16/data/postgresql.conf
        regexp: "#listen_addresses = 'localhost'"
        replace: "listen_addresses = '*'"

    - name: Copy pg_hba file
      ansible.builtin.copy:
        src: pg_hba.conf
        dest: /var/lib/pgsql/16/data/pg_hba.conf

    - name: Start PostgreSQL Service
      ansible.builtin.systemd_service:
        name: postgresql-16
        state: restarted
        enabled: yes

    - name: Copy schema file
      ansible.builtin.copy:
        src: setup.sql
        dest: /tmp/setup.sql

    - name: Load schema
      ansible.builtin.shell: sudo -u postgres /usr/pgsql-16/bin/psql < /tmp/setup.sql